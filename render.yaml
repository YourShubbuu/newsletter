services:
  - type: web
    name: news-api
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @news/db build && pnpm --filter @news/auth build && pnpm --filter @news/api build
    startCommand: node packages/db/dist/migrate.js && node services/api/dist/main.js
    initialDeployHook: node packages/db/dist/seed.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.2
      - key: ALLOW_DEV_AUTH
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: news-db
          property: connectionString
      - key: WEB_ORIGIN
        fromService:
          name: news-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: news-web
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @news/web build
    startCommand: pnpm --filter @news/web start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.2
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: news-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: news-db
    databaseName: news
    user: news
    plan: free
